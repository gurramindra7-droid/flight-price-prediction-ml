<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b18" />
    <meta
      name="description"
      content="Flight Intelligence — machine-learning powered flight price estimation. Predict the price of your journey from route, airline, timing, duration, stops and booking horizon."
    />
    <title>Flight Intelligence — ML Flight Price Prediction</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Boot screen: paints instantly while JS bundles load */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 10%, #0a1730 0%, #050b18 55%, #020409 100%);
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #boot[data-done="true"] {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        border: 1px solid rgba(120, 190, 255, 0.35);
        border-top-color: #7cc4ff;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><div class="boot-mark"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
